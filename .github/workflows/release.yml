name: Release

# Push a tag like v1.2.0 to publish: DMG + Sparkle appcast on a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # build number = commit count

      - name: Package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: VERSION=${GITHUB_REF_NAME#v} scripts/release.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/appcast.xml --title "StayVibe ${GITHUB_REF_NAME#v}" --generate-notes
